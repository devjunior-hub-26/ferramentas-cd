<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102A63">
  <title>Ferramentas do CD</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    /* ---------- Login ---------- */
    .tela-login { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 32px 16px; background: linear-gradient(160deg, #102A63, #081634); }
    .login-topo { color: var(--branco); padding: 0 8px 20px; text-align: center; }
    .login-topo .logo { width: 68px; height: 68px; border-radius: 14px; background: var(--branco); color: var(--cor); display: grid; place-items: center; margin: 0 auto 14px; }
    .login-topo .logo svg { width: 40px; height: 40px; }
    .login-topo h1 { margin: 0; color: var(--branco); }
    .login-topo p { margin: 4px 0 0; opacity: .85; }
    .login-form { padding: 22px; width: 100%; max-width: 400px; background: var(--branco); border-radius: 12px; box-shadow: 0 20px 50px rgba(4, 10, 30, .4); }
    .login-form p { margin-bottom: 0; }

    /* ---------- Sistema ---------- */
    .app { position: fixed; inset: 0; display: flex; }
    /* Painel azul-marinho sólido: o vidro fica só no marcador da página atual */
    .menu {
      flex: none; width: 256px; display: flex; flex-direction: column; color: rgba(255, 255, 255, .94); z-index: 40; overflow: hidden;
      background: #0F2558;
      transition: width .34s var(--mola), transform .4s var(--mola);
    }
    .menu-marca { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; border-bottom: 1px solid rgba(255, 255, 255, .1); white-space: nowrap; overflow: hidden; }
    /* O caminhãozinho é o único botão do menu: no menu ele recolhe, na barra (celular) ele abre */
    .menu-marca .logo-p { flex: none; width: 32px; height: 32px; border: 0; padding: 0; border-radius: 7px; background: var(--branco); color: var(--cor); display: grid; place-items: center; cursor: pointer; transition: transform .3s var(--mola); }
    .menu-marca .logo-p:active { transform: scale(.92); transition-duration: .08s; }
    .menu-marca .logo-p svg { width: 20px; height: 20px; }
    .menu-marca strong { color: var(--branco); font-size: .98rem; font-weight: 650; }
    .menu-itens { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 8px 12px; scrollbar-width: none; }
    .menu-itens::-webkit-scrollbar { display: none; }
    .menu-grupo { margin: 14px 8px 4px; font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: rgba(255, 255, 255, .68); white-space: nowrap; }
    .menu-item { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; width: 100%; min-height: var(--toque); padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: inherit; font: inherit; font-size: .9rem; font-weight: 500; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; transition: color .2s, background .15s, transform .3s var(--mola); touch-action: manipulation; }
    .menu-item svg { flex: none; width: 19px; height: 19px; }
    .menu-item:hover:not(.ativo) { background: rgba(255, 255, 255, .07); }
    .menu-item:active { transform: scale(.97); transition-duration: .2s, .15s, .08s; }
    .menu-item.ativo { color: var(--branco); font-weight: 600; text-shadow: 0 1px 2px rgba(4, 10, 30, .35); }
    /* Seleção: peça de vidro polido que desliza entre os itens */
    .menu-pilula {
      position: absolute; top: 0; left: 8px; right: 8px; height: 40px; opacity: 0; pointer-events: none; border-radius: 12px; overflow: hidden;
      /* Vidro transparente: quase sem preenchimento, a forma vem da luz nas bordas */
      background: linear-gradient(160deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .03) 45%, rgba(255, 255, 255, .07));
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .55),        /* luz na borda de cima */
        inset 0 -1px 0 rgba(255, 255, 255, .10),       /* reflexo embaixo */
        inset 1px 0 0 rgba(255, 255, 255, .12), inset -1px 0 0 rgba(255, 255, 255, .06),
        inset 0 0 12px rgba(255, 255, 255, .05),       /* espessura do vidro */
        0 4px 14px rgba(2, 8, 26, .28);
      transition: transform .42s var(--mola), height .2s ease, opacity .2s ease;
    }
    /* Reflexo de luz na parte de cima e um brilho diagonal, como em vidro polido */
    .menu-pilula::before { content: ""; position: absolute; inset: 0 0 55% 0; border-radius: 12px 12px 40% 40% / 12px 12px 8px 8px; background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, 0)); }
    .menu-pilula::after { content: ""; position: absolute; top: -40%; bottom: -40%; left: 18%; width: 22%; transform: skewX(-24deg); background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .07), rgba(255, 255, 255, 0)); }
    .menu-usuario { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid rgba(255, 255, 255, .1); }
    .menu-usuario .dados { flex: 1; min-width: 0; }
    .menu-usuario strong, .menu-usuario small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu-usuario strong { color: var(--branco); font-size: .86rem; font-weight: 600; }
    .menu-usuario small { font-size: .74rem; color: rgba(255, 255, 255, .72); }
    .btn-icone { flex: none; width: var(--toque); height: var(--toque); display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: inherit; cursor: pointer; }
    .btn-icone:hover { background: rgba(127, 140, 170, .18); }
    .btn-icone svg { width: 21px; height: 21px; }
    /* Botão do menu na barra: o caminhãozinho da marca */
    #btn-menu { width: 38px; height: 38px; margin-left: 2px; border-radius: 10px; background: var(--cor); color: var(--branco); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 2px 6px rgba(16, 42, 99, .25); transition: transform .3s var(--mola), background .15s; }
    #btn-menu:hover { background: var(--cor-forte); }
    #btn-menu:active { transform: scale(.94); transition-duration: .08s; }
    #btn-menu svg { width: 22px; height: 22px; }

    .principal { position: relative; flex: 1; min-width: 0; overflow: hidden; background: var(--fundo); }
    /* Barra translúcida: o conteúdo rola por baixo dela */
    .barra {
      position: absolute; top: max(8px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 5; display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 14px 0 8px; border-radius: 16px;
      background: var(--vidro-fundo);
      -webkit-backdrop-filter: var(--vidro-filtro);
      backdrop-filter: var(--vidro-filtro);
      border: 1px solid var(--vidro-borda);
      box-shadow: var(--vidro-sombra);
    }
    .barra-titulo { flex: 1; min-width: 0; }
    .barra-titulo small, .barra-titulo strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .barra-titulo small { font-size: .72rem; color: var(--texto-suave); }
    .barra-titulo strong { font-size: 1.04rem; font-weight: 650; line-height: 1.2; }
    .sync-barra { flex: none; display: flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; color: var(--texto-suave); }
    .sync-barra::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #22B45E; }
    .sync-barra.off::before { background: var(--erro); }
    .sync-pend { background: var(--alerta-forte); color: var(--texto); border-radius: 5px; padding: 0 6px; font-weight: 700; }
    .area { position: absolute; inset: 0; background: var(--fundo-luz), var(--fundo); }
    #quadro-ferramenta { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--fundo); }
    .menu-fundo { display: none; }

    /* Recolhido no computador: só ícones */
    @media (min-width: 901px) {
      .app.recolhido .menu { width: 60px; }
      .app.recolhido .menu-marca strong, .app.recolhido .menu-item span, .app.recolhido .menu-usuario .dados { display: none; }
      .app.recolhido .menu-grupo { visibility: hidden; height: 1px; margin: 6px 0; }
      .app.recolhido .menu-item { justify-content: center; padding: 0; }
      .app.recolhido .menu-usuario { justify-content: center; padding: 10px 0; }
      .app.recolhido .menu-marca { justify-content: center; padding: 0; }
    }
    /* Computador: o caminhãozinho fica no menu, então a barra não repete */
    @media (min-width: 901px) { #btn-menu { display: none; } .barra { padding-left: 14px; } }
    /* Celular e tablet: menu totalmente oculto; o caminhãozinho da barra abre por cima da tela */
    @media (max-width: 900px) {
      .menu { position: fixed; top: 0; bottom: 0; left: 0; width: min(290px, 84vw); transform: translateX(-100%); }
      .app.aberto .menu { transform: none; box-shadow: 0 0 40px rgba(4, 10, 30, .4); }
      .app.aberto .menu-fundo { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(16, 24, 40, .45); }
    }
    @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
      .menu-pilula { background: #2C4C94; -webkit-backdrop-filter: none; backdrop-filter: none; }
      .barra { background: var(--branco); -webkit-backdrop-filter: none; backdrop-filter: none; }
    }
    @media (prefers-reduced-motion: reduce) { .menu, .menu-pilula { transition-duration: .01ms; } }
    body.no-app > .versao-app, body.no-app > #faixa-teste { display: none; }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <section id="tela-login" class="tela-login" hidden>
    <div class="login-topo">
      <div class="logo" id="logo"></div>
      <h1>Ferramentas do CD</h1>
      <p>Entre com seu usuário e senha</p>
    </div>
    <form id="form-login" class="login-form" autocomplete="on">
      <div id="msg-login" class="aviso erro" hidden></div>
      <div class="campo">
        <label for="login">Usuário ou matrícula</label>
        <input id="login" name="login" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn bloco" type="submit" id="btn-entrar">Entrar</button>
      <p class="suave centro mt">Não tem acesso? Peça ao administrador.</p>
    </form>
  </section>

  <!-- SISTEMA -->
  <section id="tela-app" class="app" hidden>
    <aside class="menu" aria-label="Menu principal">
      <div class="menu-marca"><button type="button" class="logo-p" id="logo-menu" title="Menu" aria-label="Recolher o menu"></button><strong>Ferramentas do CD</strong></div>
      <nav class="menu-itens" id="menu-itens"></nav>
      <div class="menu-usuario">
        <div class="dados"><strong id="app-nome"></strong><small id="app-perfil"></small></div>
        <button class="btn-icone" id="btn-sair" title="Sair" aria-label="Sair"></button>
      </div>
    </aside>
    <div class="menu-fundo" id="menu-fundo"></div>
    <div class="principal">
      <header class="barra">
        <button class="btn-icone" id="btn-menu" title="Menu" aria-label="Abrir ou recolher o menu"></button>
        <div class="barra-titulo"><small id="t-grupo"></small><strong id="t-tela"></strong></div>
        <div class="sync-barra" id="sync-barra" aria-live="polite" hidden><span id="sync-texto"></span><span class="sync-pend" id="sync-pend" hidden></span></div>
      </header>
      <div class="area" id="area"></div>
    </div>
  </section>

  <!-- CONFIGURAÇÃO PENDENTE -->
  <section id="tela-config" class="conteudo estreito" hidden>
    <div class="aviso alerta mt">
      <strong>Falta configurar o servidor.</strong><br>
      Abra <code>assets/js/config.js</code> e cole em <code>API_URL</code> o endereço do App da Web do Google Apps Script (veja o README), ou deixe <code>'TESTE'</code> para experimentar.
    </div>
  </section>

  <script type="module" src="assets/js/pwa.js"></script>
  <script type="module" src="assets/js/hub.js"></script>
</body>
</html>
