<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F3F7">
  <script src="../../assets/js/guarda.js"></script>
  <title>Conferência · Ferramentas do CD</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="conferencia.css">
</head>
<body>
  <!-- Fica escondido: o estado da gravação aparece na barra do sistema -->
  <header class="topo">
    <div class="sync">
      <span id="sync-status" class="ponto">Conectando…</span>
      <span id="sync-pend" class="pendentes" hidden></span>
    </div>
  </header>

  <main class="conteudo">
    <div id="filtros"></div>
    <div class="aviso erro" id="aviso" role="status" hidden></div>
    <div class="wrap" id="app"><p class="carregando-painel">Carregando o painel…</p></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="painel.js"></script>
  <script type="module" src="../../assets/js/pwa.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
