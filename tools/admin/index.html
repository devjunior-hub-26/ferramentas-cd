<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F3F7">
  <script src="../../assets/js/guarda.js"></script>
  <title>Usuários e Equipes · Ferramentas do CD</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .grade-equipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .equipe-cartao { margin-bottom: 0; }
    .equipe-cartao.inativa { opacity: .6; }
    .membro { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--borda); flex-wrap: wrap; }
    .membro:last-child { border-bottom: none; }
    .membro select { min-height: 44px; border: 1.5px solid var(--borda); border-radius: 12px; background: var(--branco); padding: 0 8px; font: inherit; color: var(--texto); max-width: 170px; }
    .add-membro { display: flex; gap: 8px; margin-top: 10px; }
    .add-membro select { flex: 1; min-width: 0; }
  </style>
</head>
<body>
  <header class="topo">
    <a class="icone-btn" id="btn-voltar" href="../../index.html" aria-label="Voltar ao início" title="Início"></a>
    <div class="titulo">
      <strong>Usuários e Equipes</strong>
      <small id="t-usuario"></small>
    </div>
  </header>

  <nav class="abas" id="abas" role="tablist">
    <button data-aba="equipes" role="tab">Equipes</button>
    <button data-aba="historico" role="tab">Histórico</button>
  </nav>

  <main class="conteudo">
    <!-- EQUIPES -->
    <section id="aba-equipes" hidden>
      <div class="linha entre" style="margin-bottom:14px">
        <label class="check"><input type="checkbox" id="mostrar-inativas"> Mostrar equipes inativas</label>
        <button class="btn" id="btn-nova-equipe">+ Nova equipe</button>
      </div>
      <div class="aviso info">Aqui você cria as equipes. Para colocar uma pessoa na equipe, use <b>Colaboradores e Acessos</b>.</div>
      <div id="sem-equipe" class="cartao" hidden></div>
      <div id="lista-equipes" class="grade-equipes"></div>
    </section>

    <!-- HISTÓRICO -->
    <section id="aba-historico" hidden>
      <details class="filtros-fixos"><summary>Filtros</summary>
      <div class="grade-filtros">
        <div class="campo"><label for="hist-usuario">Usuário</label><select id="hist-usuario"></select></div>
        <div class="campo"><label for="hist-equipe">Equipe</label><select id="hist-equipe"></select></div>
      </div>
      </details>
      <div class="tabela-wrap mt"><table class="tabela">
        <thead><tr><th>Usuário</th><th>Equipe</th><th>Entrou em</th><th>Saiu em</th><th>Alterado por</th></tr></thead>
        <tbody id="tb-historico"></tbody>
      </table></div>
    </section>
  </main>

  <dialog class="modal" id="modal-equipe">
    <form method="dialog">
      <div class="modal-topo" id="me-titulo">Nova equipe</div>
      <div class="modal-corpo">
        <div class="campo"><label>Nome da equipe</label><input name="nome" required maxlength="60" placeholder="Ex.: Equipe A"></div>
        <div class="campo">
          <label>Líder</label>
          <select name="lider_id"></select>
          <span class="ajuda">Somente usuários com perfil Líder. O líder também passa a fazer parte da equipe.</span>
        </div>
      </div>
      <div class="modal-rodape">
        <button type="button" class="btn secundario" data-cancelar>Cancelar</button>
        <button type="submit" class="btn">Salvar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="../../assets/js/pwa.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
